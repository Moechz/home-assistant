# ===========================================================================
# Home Assistant for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : homeassistant/home-assistant:2026.11.3 (Docker Hub, official
#                  multi-arch image, used unmodified)
#                  -> https://github.com/home-assistant/core
#                  index digest sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847
#                  (linux/amd64 + linux/arm64)
#
# Ports   : host 8107 -> container 8123. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/homeassistantdocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  homeassistantdocker:
    image: homeassistant/home-assistant:2026.11.3
    container_name: homeassistantdocker
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8107:8123"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/homeassistantdocker/config:/config
    healthcheck:
      # /manifest.json answers 200 as soon as the HTTP stack is up (the root
      # URL redirects to /onboarding.html on a fresh install). Home Assistant
      # can take several minutes to finish starting on first boot, especially
      # on ARM NAS models, so the grace period is deliberately long: a short
      # one makes the App Center install report the app as not openable while
      # it is still initialising.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8123/manifest.json >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8107
    protocol: http
